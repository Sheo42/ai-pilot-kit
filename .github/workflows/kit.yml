# The kit's own checks (KIT.md, "Checks"): the CI scripts' tests, including
# one that makes a project with scripts/kit/init.py and runs its document
# checks, and the Markdown lint. Removed from a project by scripts/kit/init.py.
# The kit repository is public, so it runs on GitHub's hosted runners only:
# never a self-hosted runner (docs/method/ci-runners.md, rule 1).
name: kit
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install pytest && python3 -m pytest -q scripts/ci/tests
      - run: pip install actionlint-py==1.7.12.25 && actionlint  # the workflows are valid before a project gets them
      - run: npx --yes markdownlint-cli2@0.18.1  # settings in .markdownlint-cli2.jsonc
